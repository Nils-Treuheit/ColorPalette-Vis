<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Luminance-Sorted HSL Color Circle</title>
  <link rel="stylesheet" href="css/style.css" />
  <style>
    .generator {
      max-width: 1400px;
      margin: 0 auto;
      padding: 8px 24px;
    }
    .generator-controls {
      display: flex;
      gap: 12px;
      align-items: center;
      flex-wrap: wrap;
      margin-bottom: 16px;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 11px;
      padding: 12px;
    }
    .input-group {
      display: flex;
      gap: 8px;
      align-items: center;
    }
    input[type="number"] {
      background: var(--bg);
      color: var(--text);
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 6px 8px;
      font-variant-numeric: tabular-nums;
    }
    button {
      padding: 7px 14px;
      border: 0;
      border-radius: 8px;
      background: var(--accent);
      color: var(--accent-text);
      font: inherit;
      font-size: 13px;
      cursor: pointer;
      font-weight: 600;
    }
    button:focus-visible {
      outline: 2px solid var(--line-strong);
      outline-offset: 2px;
    }
    .results {
      display: grid;
      gap: 16px;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
    }
    .panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 11px;
      padding: 12px;
    }
    .color-circle {
      width: 300px;
      height: 300px;
      border-radius: 50%;
      margin: 0 auto;
    }
    .swatches {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }
    .swatch {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      padding: 8px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--bg);
    }
    .swatch-box {
      width: 60px;
      height: 40px;
      border-radius: 4px;
      box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.22);
    }
    .swatch-label {
      font-size: 11px;
      color: var(--text-dim);
      font-variant-numeric: tabular-nums;
      font-family: ui-monospace, monospace;
    }
    table {
      width: 100%;
      border-collapse: collapse;
    }
    th, td {
      padding: 6px 8px;
      border: 1px solid var(--line);
      font-size: 12px;
      font-variant-numeric: tabular-nums;
    }
    th {
      background: var(--bg);
      color: var(--text-dim);
      text-align: left;
    }
    td {
      color: var(--text);
    }
    .nav-link {
      color: var(--text-dim);
      text-decoration: none;
      font-size: 13px;
    }
    .nav-link:hover {
      color: var(--text);
    }
  </style>
</head>
<body>
  <header class="app-header">
    <div class="titles">
      <h1>HSL Color Circle (Spindle-Based Sampling)</h1>
      <p class="subtitle">
        Hue uniform, L spaced by volume (cbrt), S limited by max radius at L with area-based spacing; hues permuted against linear levels
      </p>
    </div>
    <div class="controls">
      <a href="index.html" class="nav-link">← Back to Smiley Gallery</a>
    </div>
  </header>
  <main class="generator">
    <div class="generator-controls">
      <div class="input-group">
        <label for="numColors">n:</label>
        <input type="number" id="numColors" min="1" max="360" value="12" />
      </div>
      <button id="generateBtn">Generate</button>
    </div>
    <div class="results">
      <div class="panel">
        <h3 style="margin: 0 0 12px 0; font-size: 16px;">Color Circle</h3>
        <div class="color-circle" id="colorCircle"></div>
      </div>
      <div class="panel">
        <h3 style="margin: 0 0 12px 0; font-size: 16px;">Adjusted Colors</h3>
        <div class="swatches" id="swatches"></div>
      </div>
      <div class="panel" style="grid-column: 1 / -1;">
        <h3 style="margin: 0 0 12px 0; font-size: 16px;">Details</h3>
        <div style="overflow-x: auto;">
          <table id="colorTable">
            <thead>
              <tr>
                <th>type</th><th>H</th><th>S</th><th>L</th><th>Hex (orig)</th><th>L*</th><th>Target L*</th><th>Hex (adj)</th><th>L* (adj)</th><th>Swatch</th>
              </tr>
            </thead>
            <tbody></tbody>
          </table>
        </div>
      </div>
    </div>
  </main>
  <script src="js/color_luminance.js"></script>
</body>
</html>
