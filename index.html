<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Color-Safe Smiley Gallery</title>
  <meta name="description" content="Gallery of color-safe and grayscale smiley faces built from neighboring triplet combinations of categorical and grayscale palettes." />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="app-header">
    <div class="titles">
      <h1>Color-Safe Smiley Gallery</h1>
      <p class="subtitle">
        Neighboring triplet combos <code>(i, i+1, i+2)</code> mapped to
        face / features / outline
      </p>
    </div>

    <div class="controls">
      <div class="segmented mode-switch" id="mode-switch" role="radiogroup" aria-label="Rendering mode"></div>
      <div class="segmented" id="level-switch" role="radiogroup" aria-label="Palette"></div>
      <p class="meta" id="gallery-meta"></p>
    </div>
  </header>

  <main>
    <div class="gallery" id="gallery"></div>
  </main>

  <p class="hint">
    Click a smiley for fullscreen · <kbd>←</kbd><kbd>→</kbd> to step ·
    <kbd>Home</kbd>/<kbd>End</kbd> to jump · <kbd>Esc</kbd> to close ·
    <a href="color_circle.html">HSL Spindle Circle</a> ·
    <a href="oklch_circle.html">Oklch Uniform Circle</a>
  </p>

  <div class="viewer" id="viewer" hidden>
    <div class="viewer-backdrop" id="viewer-backdrop"></div>
    <figure class="viewer-stage">
      <canvas id="viewer-canvas"></canvas>
      <figcaption id="viewer-caption"></figcaption>
    </figure>
    <button class="viewer-nav viewer-prev" id="viewer-prev" type="button" aria-label="Previous smiley">‹</button>
    <button class="viewer-nav viewer-next" id="viewer-next" type="button" aria-label="Next smiley">›</button>
    <button class="viewer-close" id="viewer-close" type="button" aria-label="Close viewer">✕</button>
  </div>

  <script src="js/palettes.js"></script>
  <script src="js/chips.js"></script>
  <script src="js/smiley.js"></script>
  <script src="js/gallery.js"></script>
  <script src="js/viewer.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
